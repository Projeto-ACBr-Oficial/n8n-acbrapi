# Same gates the publish workflow runs, on every push and pull request, so a
# release never fails on something a PR could have caught.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # properties.generated.ts is produced from de-para/*.json and is not
      # versioned, so it has to be generated before lint and build.
      - run: npm run gen

      - run: npm run lint

      - run: npm run build
