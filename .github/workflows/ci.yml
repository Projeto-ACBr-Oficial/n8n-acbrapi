# Same gates the publish workflow runs, on every push and pull request, so a
# release never fails on something a PR could have caught.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts is required, not hygiene: eslint-plugin-n8n-nodes-base
      # ships "preinstall": "npx only-allow pnpm", which aborts the install when
      # the package manager is npm. It also skips building isolated-vm, pulled in
      # by n8n-workflow and never needed to lint or typecheck.
      - run: npm ci --ignore-scripts

      # properties.generated.ts is produced from de-para/*.json and is not
      # versioned, so it has to be generated before lint and build.
      - run: npm run gen

      - run: npm run lint

      - run: npm run build
