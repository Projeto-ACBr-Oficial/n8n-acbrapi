# Publish to npm with provenance.
#
# Since 2026-05-01 n8n only accepts verified nodes published from GitHub
# Actions with provenance; publishing from a developer machine is not
# accepted. Provenance proves cryptographically which workflow, repository
# and commit produced the tarball.
#
# Authentication is npm trusted publishing (OIDC): npm trusts this workflow
# in this repository, configured on the package page, so no token is stored
# anywhere. npm stops accepting granular tokens with Bypass 2FA for direct
# publishing in January 2027.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for trusted publishing (OIDC) and for provenance
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1. Node 22 still bundles
          # npm 10; Node 24 bundles npm 11.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # A Release whose tag does not match package.json would publish the wrong
      # version, and a version published to npm can never be replaced. Fail
      # before anything is published.
      - name: Tag matches the version in package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

      # --ignore-scripts is required, not hygiene: eslint-plugin-n8n-nodes-base
      # ships "preinstall": "npx only-allow pnpm", which aborts the install when
      # the package manager is npm. It also skips building isolated-vm, pulled in
      # by n8n-workflow and never needed to lint or typecheck.
      - run: npm ci --ignore-scripts

      # Generate the properties before linting: the node imports
      # properties.generated.ts, which is not versioned.
      - run: npm run gen

      - run: npm run lint

      # English-only is a verification requirement that no linter checks:
      # a manual review caught Portuguese comments after two releases.
      - run: npm run lint:language

      - run: npm run build

      # --access public is required for a scoped package: npm publishes it
      # as restricted by default.
      - run: npm publish --provenance --access public
